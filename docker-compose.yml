version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: opensoar-postgres
    environment:
      POSTGRES_USER: opensoar
      POSTGRES_PASSWORD: <YOUR_PASSWORD>
      POSTGRES_DB: opensoar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensoar"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: opensoar-api
    environment:
      DATABASE_URL: postgresql://opensoar:<YOUR_PASSWORD>@postgres:5432/opensoar
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_KEY: <YOUR_API_KEY>
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
